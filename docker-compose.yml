services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: portafolio-riesgo-backend
    ports:
      - "8001:8000"
    environment:
      APP_ENV: docker
      DEBUG: "false"
      DATABASE_URL: sqlite:///./data/portafolio_riesgo.db
      ALLOWED_ORIGINS: http://localhost:8501,http://127.0.0.1:8501
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s