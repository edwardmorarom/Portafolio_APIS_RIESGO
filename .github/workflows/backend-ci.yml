name: Backend CI

on:
  push:
    branches:
      - backend
  pull_request:
    branches:
      - backend
  workflow_dispatch:

jobs:
  backend-tests:
    name: Validar backend FastAPI
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validar sintaxis del backend
        env:
          PYTHONPATH: backend
        run: |
          python -m compileall backend/app

      - name: Entrenar modelo ML base
        env:
          PYTHONPATH: backend
        run: |
          python backend/app/ml/train.py

      - name: Preparar base SQLite para pruebas
        env:
          PYTHONPATH: backend
        run: |
          cd backend
          python -m app.db.seed_db
          python -m app.db.import_perri_prices
          python -m app.jobs.run_perri_optimization

      - name: Ejecutar pruebas del backend
        env:
          PYTHONPATH: backend
        run: |
          python -m pytest tests -q

      - name: Validar build Docker del backend
        run: |
          docker compose build backend
