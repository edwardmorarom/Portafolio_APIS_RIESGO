name: Actualización automática Perri

on:
  schedule:
    # Colombia UTC-5:
    # 04:30 a.m. Colombia = 09:30 UTC
    # 05:30 p.m. Colombia = 22:30 UTC
    - cron: "30 9 * * *"
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  perri-update:
    name: Actualizar históricos y optimización Perri
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Actualizar cache histórico desde fuentes de mercado
        run: |
          python backend/update_cache.py

      - name: Validar archivo base de históricos
        run: |
          test -f roboadvisor_cache.csv
          echo "OK: roboadvisor_cache.csv encontrado"

      - name: Ejecutar carga histórica y optimización Perri
        run: |
          cd backend
          python -m app.db.seed_db
          python -m app.db.import_perri_prices
          python -m app.jobs.run_perri_optimization

      - name: Validar JSON generado
        run: |
          test -f backend/data/perri_latest_optimization.json
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("backend/data/perri_latest_optimization.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          result = data["result"]

          assert result["status"] == "ok"
          assert result["eligible_assets"] > 0
          assert result["assets_with_valid_returns"] > 0
          assert "min_risk" in result
          assert "max_sharpe" in result
          assert "max_return" in result
          assert result["horizon_keys"] == ["1y", "3y", "5y"]
          assert result["portfolio_sizes"] == [5, 10, 15]
          assert result["objectives"] == ["min_risk", "max_sharpe", "max_return"]

          horizons = result["horizons"]

          for horizon in result["horizon_keys"]:
              for size in result["portfolio_sizes"]:
                  size_payload = horizons[horizon]["portfolio_sizes"][str(size)]

                  for objective in result["objectives"]:
                      portfolio = size_payload[objective]
                      assert portfolio["selection_mode"] == "exact"
                      assert portfolio["selected_assets_count"] == size
                      assert len(portfolio["weights"]) == size

          print("OK: JSON Perri validado")
          print("Activos elegibles:", result["eligible_assets"])
          print("Activos con retornos válidos:", result["assets_with_valid_returns"])
          print("Horizontes:", ", ".join(result["horizon_keys"]))
          print("Tamaños exactos:", result["portfolio_sizes"])
          print("Objetivos:", ", ".join(result["objectives"]))
          print("Sharpe máximo:", result["max_sharpe"]["sharpe"])
          PY

      - name: Publicar JSON actualizado en la rama backend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add roboadvisor_cache.csv backend/data/perri_latest_optimization.json backend/data/perri_universe.json

          if git diff --cached --quiet; then
            echo "OK: no hay cambios en el JSON de Perri"
          else
            git commit -m "actualiza: optimización automática de Perri"
            git push origin backend
          fi

